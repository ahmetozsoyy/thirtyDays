<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gezi Rehberi</title>
  <link rel="stylesheet" href="style.css" />
  
  <link
  rel="stylesheet"
  
  integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
  crossorigin="anonymous"
  referrerpolicy="no-referrer"
/>
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css"
/>
<!-- Google Fonts (Inter) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Giriş ekranı -->
  <div id="giris-ekrani" class="fade">
     <style>
        #giris-ekrani{isolation: isolate;}
    </style>
    <h1>Türkiye Gezi Rehberi</h1>
    <button id="baslaBtn">-Başlayalım!-</button>
  </div>

  <!-- Şehir seçim ekranı -->
  <div id="sehir-secim-ekrani" class="fade-in">
    <div class="container">
      <h1 id="siteBaslik">Gezi Rehberi</h1>


      <label for="bolgeSec">Bir bölge seçin:</label>
      <select id="bolgeSec">
        <option value="">--Bölge Seçin--</option>
        <option value="Marmara">Marmara</option>
        <option value="Karadeniz">Karadeniz</option>
        <option value="Akdeniz">Akdeniz</option>
        <option value="Ege">Ege</option>
        <option value="Ic_Anadolu">İç Anadolu</option>
        <option value="Dogu_Anadolu">Doğu Anadolu</option>
        <option value="Guneydogu_Anadolu">Güneydoğu Anadolu</option>
      </select>

      <label for="sehirSec">Bir şehir seçin:</label>
      <select id="sehirSec" disabled>
        <option value="">--Şehir Seçin--</option>
      </select>

      <h2 id="sehirBaslik"></h2>
      <div id="geziYerleri"></div>
      
    </div>
           <button id="favorilerBtn">Favorilerimi Gör</button>
  <div id="favorilerContainer" style="display:none;">
  <h2 id="favorilerBaslik">Favori Yerler</h2>
  <div id="favorilerAlani"></div>
</div>

  </div>

  <!-- Karanlık Mod Kaldırıldı -->

<!-- 1. jQuery -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>

<!-- 2. Lightbox2 JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/js/lightbox.min.js"></script>

  <!-- Harici script dosyaları -->
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
